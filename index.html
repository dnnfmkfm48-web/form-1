<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#117A26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Обход">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">

<title>Обход</title>
<style>
:root{--ink:#1E1F25;--muted:#6B6E78;--line:#E1E3E8;--acc:#117A26;--acc-soft:#E3F4E6;--neg:#C84A00;--neg-soft:#FDEDE3;--bg:#F5F6F8}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.35 -apple-system,BlinkMacSystemFont,"SB Sans Text","Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 14px 110px}
.head{font-size:13px;color:var(--muted);margin:2px 0 6px}
h1{font-size:21px;margin:4px 0 4px;line-height:1.2}
h2{font-size:17px;margin:18px 0 6px}
.sub{color:var(--muted);font-size:14px;margin:0 0 10px}
.note{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0;color:var(--ink)}
.note.warn{background:var(--neg-soft);border-color:#F3C9AE}
.note.okn{background:var(--acc-soft);border-color:#BFE3C6}
.btn{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;border:1px solid var(--line);background:#fff;border-radius:12px;font:inherit;font-size:17px;margin:8px 0;padding:11px 14px;text-align:left;color:var(--ink);cursor:pointer}
.btn:active{filter:brightness(.95)}
.btn.c{justify-content:center;text-align:center}
.btn.ok{background:var(--acc);color:#fff;border-color:var(--acc);justify-content:center;font-weight:600}
.btn.bad{background:var(--neg-soft);border-color:#F3C9AE;color:var(--neg);justify-content:center;font-weight:600}
.btn.on{border-color:var(--acc);background:var(--acc-soft)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);font-size:15px;min-height:40px;justify-content:center}
.btn.small{min-height:44px;font-size:15px}
.btn[disabled]{opacity:.45}
.box{flex:0 0 22px;height:22px;border:2px solid #B9BCC6;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff}
.on .box{background:var(--acc);border-color:var(--acc)}
.tag{font-size:12px;color:var(--neg);font-weight:600;margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}
.grid.g5{grid-template-columns:repeat(5,1fr)}
.grid.g2{grid-template-columns:repeat(2,1fr)}
.grid .btn{margin:0;justify-content:center;text-align:center;padding:10px 4px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center}
.bar .btn{margin:0;max-width:270px;justify-content:center}
input.inp,textarea.inp{width:100%;font:inherit;font-size:18px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
textarea.inp{min-height:96px;resize:vertical;font-size:16px}
input.big{font-size:28px;text-align:center;letter-spacing:2px}
.err{color:var(--neg);font-weight:600;margin:8px 0}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.thumbs img{width:76px;height:76px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#eee}
.row2{display:flex;gap:8px}.row2 .btn{flex:1;justify-content:center}
.sum{background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px 12px;margin:10px 0}
.sum .it{padding:9px 0;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:flex-start}
.sum .it:last-child{border-bottom:0}
.sum .it .t{flex:1}
.sum .it .e{flex:0 0 auto;font-size:14px;color:var(--acc);background:none;border:0;padding:4px 0 4px 8px;font-weight:600}
.small{font-size:13px;color:var(--muted)}
.list .btn{font-size:15px;min-height:46px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--neg);flex:0 0 9px}
.dot.sent{background:var(--acc)}
.upd{position:fixed;left:10px;right:10px;top:calc(8px + env(safe-area-inset-top));z-index:5;background:var(--ink);color:#fff;border-radius:12px;padding:10px 12px;font-size:14px;display:flex;gap:10px;align-items:center}
.rowc{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 12px;margin:8px 0}
.rowc .lb{flex:1;font-size:16px}.rowc .lb .small{display:block}
.rowc .btn{width:auto;min-width:58px;margin:0;min-height:46px;justify-content:center;padding:6px 10px}
.rowc.okr{background:var(--acc-soft);border-color:#BFE3C6}.rowc.bdr{background:var(--neg-soft);border-color:#F3C9AE}
.upd button{margin-left:auto;background:#fff;color:var(--ink);border:0;border-radius:8px;padding:6px 10px;font:inherit;font-size:14px}
</style>
</head>

function idbAll(store) { return idb(store, 'readonly', function (s) { return s.getAll(); }); }
function idbDel(store, key) { return idb(store, 'readwrite', function (s) { return s.delete(key); }); }
function idbKeys(store) { return idb(store, 'readonly', function (s) { return s.getAllKeys(); }); }

var RECS = {};      // uid -> запись
var PH = {};        // кэш миниатюр id -> dataURL
var S = LS.get('ob_session', null) || {step: {s: 'menu'}, stack: [], draft: null};
var PREP = null;    // подготовленные файлы для отправки (только в памяти)
var lastRender = 0;
var busy = false;

function saveSession() { LS.set('ob_session', S); }
function name() { return LS.get('ob_name', ''); }
function deviceId() { var d = LS.get('ob_device', ''); if (!d) { d = uid().slice(0, 8); LS.set('ob_device', d); } return d; }
function floorOf(apt) { var a = APT[apt]; if (a && a.floor) return a.floor; var f = LS.get('ob_floors', {}); return f[apt] || null; }
function learnFloor(apt, fl) { var f = LS.get('ob_floors', {}); f[apt] = fl; LS.set('ob_floors', f); }

function recList() { return Object.keys(RECS).map(function (k) { return RECS[k]; }); }
function unsent(r) { return !r.s || r.u > r.s; }
function objKey(kind, sec, floor, apt) { return kind === 'apt' ? 'apt:' + apt : 'mop:' + sec + ':' + floor; }
function lastRec(key) {
  var best = null;
  recList().forEach(function (r) { if (objKey(r.kind, r.sec, r.floor, r.apt) === key && (!best || r.saved > best.saved)) best = r; });
  return best;
}

function inspected(st) { return st === 'surveyed' || (K.apt.inspected || []).indexOf(st) >= 0; }

// ------------------------------------------------------------------ навигация
var MAX_STACK = 150;
function go(step) { S.stack.push(S.step); if (S.stack.length > MAX_STACK) S.stack = S.stack.slice(-MAX_STACK); S.step = step; }
function back() {
  if (S.stack.length) { S.step = S.stack.pop(); return; }
  var st = S.step, d = S.draft;
  if (d && st.s === 'summary') S.step = {s: 'block', i: blocks(d.kind).length - 1};
  else if (d && st.s === 'block' && st.i > 0) S.step = {s: 'block', i: st.i - 1};
  else if (d && st.s === 'block' && d.kind === 'apt') S.step = {s: 'status'};
  else S.step = {s: 'menu'};
}
function head(d) {
  if (d.kind === 'apt') return 'Кв. ' + d.apt + ', секция ' + d.sec + (d.floor ? ', этаж ' + d.floor : '');
  return 'МОП, секция ' + d.sec + ', этаж ' + d.floor;
}
function newDraft(kind, sec, floor, apt) {
  return {uid: null, kind: kind, sec: sec, floor: floor, apt: apt || null, status: kind === 'mop' ? 'surveyed' : null, track: kind === 'mop' ? 'survey' : null, blocks: {}, started: now()};
}
function blk(i) {
  var d = S.draft, code = block(d.kind, i).code;
  var a = d.blocks[code] || (d.blocks[code] = {});
  if (!a.p) a.p = []; if (!a.rooms) a.rooms = []; if (!a.photos) a.photos = []; if (!a.units) a.units = {};
  return a;
}
function clearBlock(a) { a.p = []; a.rooms = []; a.photos = []; a.units = {}; delete a.other; delete a.comment; delete a.text; }
function resumeStep(d) {
  if (d.kind === 'apt') {
    if (!d.status) return {s: 'status'};
    if (!inspected(d.status)) return {s: 'summary'};
    if (d.track === 'self') return d.present && d.present.length ? {s: 'self_hub'} : {s: 'self_rooms'};
  }
  var b = blocks(d.kind);
  for (var i = 0; i < b.length; i++) if (!(d.blocks[b[i].code] || {}).r) return {s: 'block', i: i};
  return {s: 'summary'};
}
function toSummary() { var r = S.draft.ret; delete S.draft.ret; S.stack = Array.isArray(r) ? r : []; S.step = {s: 'summary'}; }
function advance(i) {
  var d = S.draft, n = blocks(d.kind).length;
  if (d.track === 'self') { toHub(); return; }
  if (d.ret !== undefined && d.ret !== null) toSummary();
  else if (i + 1 < n) go({s: 'block', i: i + 1});
  else go({s: 'summary'});
}
// ---- обход без жильцов: по помещениям
function selfCfg() { return K.apt.self || {rooms: [], default: []}; }
function roomBlocks(room) {
  return blocks('apt').filter(function (b) {
    if (b.type === 'free' || b.code === 'entry') return false;
    if (b.rooms) return (CL.rooms[b.rooms] || []).indexOf(room) >= 0;
    return b.room === room;
  });
}
function selfAns(room, code) {
  var d = S.draft; if (!d.rb) d.rb = {}; if (!d.rb[room]) d.rb[room] = {};
  var a = d.rb[room][code] || (d.rb[room][code] = {});
  if (!a.p) a.p = []; if (!a.photos) a.photos = []; if (!a.units) a.units = {};
  return a;
}
function roomState(d, room) {
  var bs = roomBlocks(room), done = 0, bad = 0;
  bs.forEach(function (b) { var a = d.rb && d.rb[room] && d.rb[room][b.code]; if (a && a.r) { done++; if (a.r === 'problem') bad++; } });
  return {total: bs.length, done: done, bad: bad};
}
function toHub() { var d = S.draft; S.stack = (d.hubStack || []).slice(); S.step = {s: 'self_hub'}; }
function toRoom(room) { var d = S.draft; S.stack = (d.roomStack || []).slice(); S.step = {s: 'self_room', room: room}; }
function selfLine(room, code, a) {
  var b = block('apt', bindex('apt', code));
  if (b.type === 'units') {
    return (b.units || []).filter(function (u) { return a.units && a.units[u.code]; }).map(function (u) {
      var ud = a.units[u.code];
      return u.label + ' — ' + (ud.p || []).map(function (p) { return p === 'other' && ud.other ? low(ud.other) : low(plabel('apt', code, p, u.code)); }).join(', ');
    }).join('; ');
  }
  return (a.p || []).map(function (p) { return p === 'other' && a.other ? low(a.other) : low(plabel('apt', code, p)); }).join(', ');
}
function selfToBlocks(rec) {
  // ответы по помещениям -> ответы по блокам (с разбивкой по помещениям для базы)
  blocks('apt').forEach(function (b) {
    if (b.code === 'entry' || b.type === 'free') return;
    var rs = (rec.present || []).filter(function (r) { return roomBlocks(r).some(function (x) { return x.code === b.code; }); });
    if (!rs.length) { rec.blocks[b.code] = {r: b.na ? 'na' : 'skip', p: [], rooms: [], photos: [], units: {}}; return; }
    var prob = rs.filter(function (r) { var x = rec.rb[r] && rec.rb[r][b.code]; return x && x.r === 'problem'; });
    var answered = rs.filter(function (r) { var x = rec.rb[r] && rec.rb[r][b.code]; return x && x.r; });
    if (!prob.length) { rec.blocks[b.code] = {r: answered.length ? 'ok' : 'skip', p: [], rooms: [], photos: [], units: {}}; return; }
    var a = {r: 'problem', p: [], rooms: prob.slice(), photos: [], units: {}, by_room: {}}, comments = [], others = [];
    prob.forEach(function (r) {
      var x = clone(rec.rb[r][b.code]);
      a.by_room[r] = {p: x.p || [], other: x.other, comment: x.comment, photos: x.photos || [], units: x.units || {}};
      (x.p || []).forEach(function (p) { if (a.p.indexOf(p) < 0) a.p.push(p); });
      if (x.other && (x.p || []).indexOf('other') >= 0) others.push(x.other);
      if (x.comment) comments.push(r + ': ' + x.comment);
      a.photos = a.photos.concat(x.photos || []);
      Object.keys(x.units || {}).forEach(function (u) { a.units[u] = x.units[u]; });
    });
    if (others.length) a.other = others.join('; ');
    if (comments.length) a.comment = comments.join('; ');
    rec.blocks[b.code] = a;
  });
}

function selectedUnits(kind, i, a) { return (block(kind, i).units || []).map(function (u) { return u.code; }).filter(function (c) { return a.units && a.units[c]; }); }

function openObject(kind, sec, floor, apt) {
  var d = S.draft;
  if (d && !d.uid && d.kind === kind && d.sec === sec && (kind === 'apt' ? d.apt === apt : d.floor === floor)) {
    d.floor = floor; go(kind === 'apt' ? {s: 'status'} : {s: 'block', i: 0}); return;
  }
  var prev = lastRec(objKey(kind, sec, floor, apt));
  if (prev) { go({s: 'existing', uid: prev.uid, kind: kind, sec: sec, floor: floor, apt: apt}); return; }
  S.draft = newDraft(kind, sec, floor, apt);
  go(kind === 'apt' ? {s: 'status'} : {s: 'block', i: 0});
}
function chooseApt(sec, apt, confirmed) {
  if (!APT[apt]) return '!Квартиры ' + apt + ' нет в списке';
  if (!confirmed) { go({s: 'apt_confirm', sec: sec, apt: apt}); return; }
  var fl = floorOf(apt);
  if (!fl) { go({s: 'apt_floor', sec: sec, apt: apt}); return; }
  openObject('apt', sec, fl, apt);
}
function reopen(u) {
  var r = RECS[u];
  if (!r) return '!Запись не найдена';
  if (S.draft) return '!Сначала завершите или удалите текущую запись (' + head(S.draft) + ')';
  var d = clone(r); delete d.u; delete d.s; delete d.saved; delete d.updated; delete d.inspector;
  S.draft = d; S.stack = [{s: 'menu'}]; S.step = {s: 'summary'};
}

// ------------------------------------------------------------------ сохранение записи
function checkDraft(d) {
  if (d.kind === 'apt' && !d.status) return 'Не выбран статус визита';
  if (d.kind === 'apt' && d.track === 'self' && inspected(d.status)) {
    var ms = [];
    if (!(d.blocks.entry || {}).r) ms.push('Входная дверь');
    (d.present || []).forEach(function (r) { var st = roomState(d, r); if (st.done < st.total) ms.push(r); });
    if (!(d.present || []).length) ms.push('не выбраны помещения');
    return ms.length ? 'Не проверено: ' + ms.join(', ') : null;
  }
  if (inspected(d.status)) {
    var miss = blocks(d.kind).filter(function (b) { return !(d.blocks[b.code] || {}).r; }).map(function (b) { return b.short; });
    if (miss.length) return 'Не заполнено: ' + miss.join(', ');
  }
  return null;
}
function submit() {
  var d = S.draft, err = checkDraft(d);
  if (err) return '!' + err;
  var old = d.uid ? RECS[d.uid] : null;
  var rec = clone(d);
  delete rec.ret;
  if (rec.kind === 'apt' && !inspected(rec.status)) { rec.blocks = {}; delete rec.rb; delete rec.present; rec.track = null; }
  else if (rec.track === 'self') {
    selfToBlocks(rec);
    var fb = blocks('apt').filter(function (b) { return b.type === 'free'; })[0];
    if (fb && !(rec.blocks[fb.code] || {}).r) rec.blocks[fb.code] = {r: 'skip', p: [], rooms: [], photos: [], units: {}};
  } else {
    delete rec.rb; delete rec.present;
    Object.keys(rec.blocks).forEach(function (k) { delete rec.blocks[k].by_room; });
  }
  delete rec.hubStack; delete rec.roomStack;
  Object.keys(rec.blocks).forEach(function (k) {
    var a = rec.blocks[k];
    if (a.p && a.p.indexOf('other') < 0) delete a.other;
    Object.keys(a.units || {}).forEach(function (u) { var ud = a.units[u]; if (ud.p.indexOf('other') < 0) delete ud.other; });
  });
  rec.uid = d.uid || uid();
  rec.saved = old ? old.saved : now();
  rec.updated = now();
  rec.u = Date.now();
  rec.s = old ? old.s : 0;
  rec.inspector = name();
  RECS[rec.uid] = rec;
  busy = true;
  idbPut('records', rec).then(function () { busy = false; render(); }, function (e) { busy = false; alert('Ошибка сохранения: ' + e.message); });
  S.draft = null; S.stack = [];
  S.step = {s: 'saved', uid: rec.uid};
  PREP = null;
}
function countIssues(r) {
  var n = 0;
  Object.keys(r.blocks || {}).forEach(function (k) {
    var a = r.blocks[k]; if (a.r !== 'problem') return;
    if (a.units && Object.keys(a.units).length) Object.keys(a.units).forEach(function (u) { n += (a.units[u].p || []).length; });
    else n += (a.p || []).length;
  });
  return n;
}

// ------------------------------------------------------------------ действия
function act(data) {
  var st = S.step, nm = st.s, d = S.draft, kind = d ? d.kind : null;
  if (data === 'bk') { back(); return; }
  if (data === 'm:menu') { S.step = {s: 'menu'}; S.stack = []; return; }

  if (nm === 'menu') {
    if (data === 'm:apt' || data === 'm:mop') {
      if (d) return '!Есть незавершённая запись (' + head(d) + '). Продолжите или удалите её.';
      go({s: 'section', mode: data.slice(2)});
    } else if (data === 'm:recs') go({s: 'records'});
    else if (data === 'm:send') { PREP = null; go({s: 'send'}); }
    else if (data === 'm:set') go({s: 'settings'});
    else if (data === 'dr:cont' && d) { S.step = resumeStep(d); S.stack = []; }
    else if (data === 'dr:del' && d) go({s: 'confirm_del'});
    return;
  }
  if (nm === 'section' && data.indexOf('sec:') === 0) {
    var sec = +data.slice(4);
    go(st.mode === 'apt' ? {s: 'apt_input', sec: sec} : {s: 'floor', sec: sec});
    return;
  }
  if (nm === 'apt_input') {
    if (data.indexOf('nx:') === 0) return chooseApt(st.sec, +data.slice(3), true);
    if (data === 'ai:go') {
      var digits = String(st.val || '').replace(/\D/g, '');
      if (!digits) { st.err = 'Нужен номер квартиры цифрами'; return; }
      var n = +digits, row = APT[n];
      if (!row) { st.err = 'Квартиры ' + n + ' нет в списке'; return; }
      if (row.sec !== st.sec) { var rg = secRange(st.sec); st.err = 'Кв. ' + n + ' в секции ' + row.sec + ', а не в ' + st.sec + ' (здесь кв. ' + rg[0] + '–' + rg[1] + ')'; return; }
      delete st.err; st.val = '';
      return chooseApt(st.sec, n, false);
    }
    return;
  }
  if (nm === 'apt_confirm') {
    if (data === 'ca:y') return chooseApt(st.sec, st.apt, true);
    if (data === 'ca:n') back();
    return;
  }
  if (nm === 'apt_floor' && data.indexOf('af:') === 0) { var fl = +data.slice(3); learnFloor(st.apt, fl); openObject('apt', st.sec, fl, st.apt); return; }
  if (nm === 'floor' && data.indexOf('fl:') === 0) { openObject('mop', st.sec, +data.slice(3), null); return; }
  if (nm === 'existing') {
    if (data === 'ex:new') { S.draft = newDraft(st.kind, st.sec, st.floor, st.apt); go(st.kind === 'apt' ? {s: 'status'} : {s: 'block', i: 0}); }
    else if (data === 'ex:edit') { if (S.draft && !S.draft.uid) S.draft = null; return reopenFrom(st.uid); }
    return;
  }
  if (nm === 'status' && data.indexOf('st:') === 0) {
    d.status = data.slice(3);
    var hasRet = d.ret !== undefined && d.ret !== null;
    if (d.status === 'self') {
      d.track = 'self';
      if (hasRet && d.present && d.present.length && d.rb) { toSummary(); return; }
      delete d.ret;
      if (!d.present) d.present = (selfCfg().default || []).slice();
      go({s: 'self_rooms'}); return;
    }
    if (inspected(d.status)) {
      d.track = 'survey';
      Object.keys(d.blocks).forEach(function (k) { delete d.blocks[k].by_room; });
      var any = blocks('apt').some(function (b) { return b.code !== 'entry' && (d.blocks[b.code] || {}).r; });
      if (hasRet && any) { toSummary(); return; }
      delete d.ret; go({s: 'block', i: 0}); return;
    }
    if (hasRet) { toSummary(); return; }
    return submit();
  }
  if (nm === 'self_rooms') {
    var cfg = selfCfg();
    if (data.indexOf('sr:t:') === 0) {
      var rn = cfg.rooms[+data.slice(5)], pos0 = d.present.indexOf(rn);
      if (pos0 >= 0) d.present.splice(pos0, 1); else d.present.push(rn);
      d.present.sort(function (x, y) { return cfg.rooms.indexOf(x) - cfg.rooms.indexOf(y); });
    } else if (data === 'sr:nx') {
      if (!d.present.length) return '!Отметьте хотя бы одно помещение';
      if (d.ret !== undefined && d.ret !== null) { toSummary(); return; }
      go({s: 'self_hub'}); d.hubStack = S.stack.slice();
    }
    return;
  }
  if (nm === 'self_hub') {
    if (!d.hubStack) d.hubStack = S.stack.slice();
    if (data === 'sh:entry') { go({s: 'block', i: bindex('apt', 'entry')}); return; }
    if (data === 'sh:free') { var fi = -1; blocks('apt').forEach(function (b, k) { if (b.type === 'free') fi = k; }); go({s: 'block', i: fi}); return; }
    if (data === 'sh:rooms') { go({s: 'self_rooms'}); return; }
    if (data.indexOf('sh:r:') === 0) { var room = d.present[+data.slice(5)]; go({s: 'self_room', room: room}); d.roomStack = S.stack.slice(); return; }
    if (data === 'sh:done') { var e = checkDraft(d); if (e) return '!' + e; go({s: 'summary'}); return; }
    return;
  }
  if (nm === 'self_room') {
    var R0 = st.room;
    if (!d.roomStack) d.roomStack = S.stack.slice();
    if (data.indexOf('so:ok:') === 0) { var a0 = selfAns(R0, data.slice(6)); a0.r = 'ok'; a0.p = []; a0.units = {}; a0.photos = []; delete a0.other; delete a0.comment; return; }
    if (data.indexOf('so:pb:') === 0) {
      var c0 = data.slice(6), b0 = block('apt', bindex('apt', c0)), a1 = selfAns(R0, c0);
      a1.r = 'problem';
      if (b0.type === 'units') go({s: 'self_units', room: R0, code: c0});
      else go({s: 'self_probs', room: R0, code: c0, u: null});
      return;
    }
    if (data === 'so:rest') {
      roomBlocks(R0).forEach(function (b) { var x = selfAns(R0, b.code); if (!x.r) x.r = 'ok'; });
      toHub(); return;
    }
    if (data === 'so:done') { toHub(); return; }
    return;
  }
  if (nm === 'self_units') {
    var a2u = selfAns(st.room, st.code);
    if (data.indexOf('u:') === 0) { var uc = data.slice(2); if (a2u.units[uc]) delete a2u.units[uc]; else a2u.units[uc] = {p: []}; return; }
    if (data === 'un:nx') {
      var sl = (block('apt', bindex('apt', st.code)).units || []).map(function (u) { return u.code; }).filter(function (c) { return a2u.units[c]; });
      if (!sl.length) return '!Отметьте технику с проблемами';
      go({s: 'self_probs', room: st.room, code: st.code, u: sl[0]}); return;
    }
    return;
  }
  if (nm === 'self_probs') {
    var a3s = selfAns(st.room, st.code), tg3 = st.u ? (a3s.units[st.u] || (a3s.units[st.u] = {p: []})) : a3s;
    if (data === 'p:nx') {
      if (tg3.p.indexOf('other') >= 0 && !(tg3.other || '').trim()) return '!Впишите, что не так, или снимите отметку «Другое»';
      if (!tg3.p.length) return '!Отметьте хотя бы одну проблему или нажмите «Назад»';
      if (st.u) {
        var sl2 = (block('apt', bindex('apt', st.code)).units || []).map(function (u) { return u.code; }).filter(function (c) { return a3s.units[c]; });
        var k3 = sl2.indexOf(st.u);
        if (k3 >= 0 && k3 + 1 < sl2.length) { go({s: 'self_probs', room: st.room, code: st.code, u: sl2[k3 + 1]}); return; }
      }
      go({s: 'self_comment', room: st.room, code: st.code}); return;
    }
    if (data.indexOf('p:') === 0) { var pc3 = data.slice(2), ps3 = tg3.p.indexOf(pc3); if (ps3 >= 0) tg3.p.splice(ps3, 1); else tg3.p.push(pc3); }
    return;
  }
  if (nm === 'self_comment' && data === 'c:done') { toRoom(st.room); return; }
  if (nm === 'block') {
    var i = st.i, b = block(kind, i), a = blk(i), bt = b.type;
    if (data === 'b:ok' || data === 'b:sk' || data === 'b:na') { clearBlock(a); a.r = {'b:ok': 'ok', 'b:sk': 'skip', 'b:na': 'na'}[data]; advance(i); }
    else if (data === 'b:pb') { a.r = 'problem'; go({s: 'probs', i: i, u: null}); }
    else if (bt === 'units' && data === 'un:nx') {
      var sel = selectedUnits(kind, i, a);
      if (!sel.length) return '!Отметьте технику с проблемами или нажмите «Вся техника в порядке»';
      a.r = 'problem'; go({s: 'probs', i: i, u: sel[0]});
    } else if (bt === 'units' && data.indexOf('u:') === 0) {
      var c = data.slice(2);
      if (a.units[c]) delete a.units[c]; else a.units[c] = {p: []};
    } else if (bt === 'free' && data === 'f:done') {
      a.r = (a.text || a.photos.length) ? 'text' : 'skip'; advance(i);
    }
    return;
  }
  if (nm === 'probs') {
    var i2 = st.i, unit = st.u, a2 = blk(i2);
    var tg = unit ? (a2.units[unit] || (a2.units[unit] = {p: []})) : a2;
    if (data === 'p:nx') {
      if (tg.p.indexOf('other') >= 0 && !(tg.other || '').trim()) return '!Впишите, что не так, или снимите отметку «Другое»';
      if (!tg.p.length) return '!Отметьте хотя бы одну проблему или нажмите «Назад»';
      if (unit) {
        var sel2 = selectedUnits(kind, i2, a2), k = sel2.indexOf(unit);
        if (k >= 0 && k + 1 < sel2.length) go({s: 'probs', i: i2, u: sel2[k + 1]});
        else go({s: 'comment', i: i2});
      } else if (rooms(kind, i2).length) go({s: 'rooms', i: i2});
      else go({s: 'comment', i: i2});
    } else if (data.indexOf('p:') === 0) {
      var pc = data.slice(2), pos = tg.p.indexOf(pc);
      if (pos >= 0) tg.p.splice(pos, 1); else tg.p.push(pc);
    }
    return;
  }
  if (nm === 'rooms') {

function compress(file) {

    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function () {

      w = Math.round(w * k); h = Math.round(h * k);

      c.getContext('2d').drawImage(img, 0, 0, w, h);

    };
    img.onerror = function () { URL.revokeObjectURL(url); rej(new Error('не удалось прочитать фото')); };
    img.src = url;

}

// ------------------------------------------------------------------ отрисовка и события
var app = document.getElementById('app'), bar = document.getElementById('bar');
var LOCK = {val: '', err: ''};
function render(note) {
  var out;
  if (!K) {
    out = R.lock(LOCK);
  } else {
    if (!name() && S.step.s !== 'settings') { S.step = {s: 'settings'}; S.stack = []; }
    var fn = R[S.step.s] || R.menu;
    out = fn(S.step);
  }
  app.innerHTML = (note ? '<div class="note warn">' + esc(note) + '</div>' : '') + out[0] + (busy ? '<div class="note">⏳ Подождите…</div>' : '');
  bar.innerHTML = out[1] || '';
  bar.style.display = out[1] ? 'flex' : 'none';
  lastRender = Date.now();
  if (K) saveSession();
  fillThumbs();
}
function tryUnlock(code, silent) {
  busy = true; if (!silent) render();
  return unlock(code).then(function (data) {
    initData(data); LS.set('ob_code', code); LOCK = {val: '', err: ''}; busy = false;
    if (S.step.s === 'send' || S.step.s === 'saved' && !RECS[S.step.uid]) { S.step = {s: 'menu'}; S.stack = []; }
    render();
  }, function () {
    busy = false; LS.set('ob_code', ''); LOCK.err = silent ? '' : 'Неверный код'; render();
  });
}
function onTap(e) {
  var el = e.target.closest('[data-a]');
  if (el) {
    e.preventDefault();
    if (busy) return;
    if (Date.now() - lastRender < 350) return;     // защита от двойного нажатия
    if (!K) { if (el.getAttribute('data-a') === 'lk:go') tryUnlock(String(LOCK.val || '').trim(), false); return; }
    var before = S.step;
    var res = act(el.getAttribute('data-a'));
    render();
    if (res) { if (res.charAt(0) === '!') alert(res.slice(1)); else render(res); }
    if (S.step !== before) window.scrollTo(0, 0);
    return;
  }
  var del = e.target.closest('[data-del]');
  if (del && S.draft && (S.step.i !== undefined || S.step.s === 'self_comment')) {
    var k = +del.getAttribute('data-del'), a = curTarget();
    if (confirm('Удалить это фото?')) { a.photos.splice(k, 1); render(); }
  }
}
document.addEventListener('click', function (e) { if (e.target.closest('#app') || e.target.closest('#bar')) onTap(e); });
document.addEventListener('input', function (e) {
  var k = e.target.getAttribute && e.target.getAttribute('data-bind');
  if (!k) return;
  var v = e.target.value, st = S.step;
  if (k === 'code') { LOCK.val = v; return; }
  if (k === 'aptnum') st.val = v;
  else if (k === 'name') LS.set('ob_name', v.trim());
  else if (k === 'comment') blk(st.i).comment = v;
  else if (k === 'free') { var a = blk(st.i); a.text = v; }
  else if (k === 'other') { var a2 = blk(st.i); var tg = st.u ? a2.units[st.u] : a2; tg.other = v; }
  else if (k === 'scomment') selfAns(st.room, st.code).comment = v;
  else if (k === 'sother') { var a4 = selfAns(st.room, st.code); (st.u ? a4.units[st.u] : a4).other = v; }
  saveSession();
});

  if (e.key === 'Enter' && e.target.getAttribute && e.target.getAttribute('data-bind') === 'aptnum') { e.preventDefault(); act('ai:go'); render(); }

function start() {
  idbOpen().then(function () { return idbAll('records'); }).then(function (rs) {
    rs.forEach(function (r) { RECS[r.uid] = r; });
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});
    var code = LS.get('ob_code', '');
    if (code) tryUnlock(code, true); else render();
    setTimeout(function () { if (K) gcPhotos(); }, 4000);
  }, function (e) {
    app.innerHTML = '<div class="note warn">Браузер не даёт сохранять данные (' + esc(e && e.message) + '). Откройте анкету в Safari или Chrome, не в режиме инкогнито.</div>';
  });
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    var hadCtrl = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      reg.addEventListener('updatefound', function () {
        var w = reg.installing;
        w && w.addEventListener('statechange', function () {
          if (w.state === 'activated' && hadCtrl) {
            var u = document.createElement('div'); u.className = 'upd';
            u.innerHTML = 'Загружена новая версия анкеты.<button>Обновить</button>';
            u.querySelector('button').onclick = function () { location.reload(); };
            document.body.appendChild(u);
          }
        });
      });
    }).catch(function () {});
  }
}
